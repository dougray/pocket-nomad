name: NomadPocket
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NomadKit:
    path: NomadKit
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  NomadPocket:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: App/Resources/Guides
        type: folder
        buildPhase: resources
      - path: App/Resources/Map
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    dependencies:
      - package: NomadKit
        product: ZIMKit
      - package: NomadKit
        product: NomadSearch
      - package: MapLibre
      - target: NomadPocketWatch
    postCompileScripts:
      - name: Embed llama.framework (device only)
        script: "\"$PROJECT_DIR/tools/embed-llama.sh\""
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pocket Nomad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Logo
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UIBackgroundModes: [bluetooth-central, location]
        NSLocationWhenInUseUsageDescription: Pocket Nomad shows where you are on the offline map and compass, can add your coordinates to an SOS message, and (if you turn it on) records where your radio hears others for the coverage map. In drive mode, which you turn on, this keeps working while the phone is locked. Your location never leaves the phone unless you send or export it.
        NSBluetoothAlwaysUsageDescription: Pocket Nomad connects to your Meshtastic or MeshCore radios over Bluetooth so you can send and receive mesh messages without cell service.
        NSCameraUsageDescription: Pocket Nomad uses the camera flash as an SOS and Morse signal light.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.reference
        NSHumanReadableCopyright: "Apache License 2.0. See LICENSE."
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIM Archive
            LSHandlerRank: Owner
            LSItemContentTypes: [org.openzim.zim]
          - CFBundleTypeName: PMTiles Map
            LSHandlerRank: Owner
            LSItemContentTypes: [io.protomaps.pmtiles]
          - CFBundleTypeName: GGUF Model
            LSHandlerRank: Owner
            LSItemContentTypes: [org.ggml.gguf]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.openzim.zim
            UTTypeDescription: ZIM Archive
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [zim]}
          - UTTypeIdentifier: io.protomaps.pmtiles
            UTTypeDescription: PMTiles Map
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [pmtiles]}
          - UTTypeIdentifier: org.ggml.gguf
            UTTypeDescription: GGUF Model
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {public.filename-extension: [gguf]}
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  NomadPocketWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/Sources
      - path: Shared
      - path: Watch/Assets.xcassets
      # The same guide HTML the phone ships; the watch reads the urgent ones' steps from it.
      - path: App/Resources/Guides
        type: folder
        buildPhase: resources
    dependencies:
      - target: NomadPocketWatchWidgets
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Pocket Nomad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: org.nomadpocket.NomadPocket
        CFBundleURLTypes:
          - CFBundleURLName: org.nomadpocket.NomadPocket.watchkitapp
            CFBundleURLSchemes: [nomadpocket-watch]
        NSLocationWhenInUseUsageDescription: Pocket Nomad shows your heading and coordinates on the watch, and can add the watch's location to a mesh SOS that you choose to send. Your location never leaves the watch unless you send it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nomadpocket.NomadPocket.watchkitapp
        TARGETED_DEVICE_FAMILY: 4
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  NomadPocketWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/Widgets
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    info:
      path: Watch/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pocket Nomad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.nomadpocket.NomadPocket.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: 4
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  NomadPocketTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MeshTests, AppTests]
    dependencies:
      - target: NomadPocket
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.nomadpocket.NomadPocketTests
  NomadPocketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: NomadPocket
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.nomadpocket.NomadPocketUITests
        TEST_TARGET_NAME: NomadPocket
        # UI tests run in their own process, which doesn't carry llama.framework.
        OTHER_LDFLAGS: ""
        "OTHER_LDFLAGS[sdk=iphoneos*]": ""
schemes:
  NomadPocket:
    build:
      targets:
        NomadPocket: all
        NomadPocketTests: [test]
        NomadPocketUITests: [test]
    test:
      targets: [NomadPocketTests, NomadPocketUITests]
